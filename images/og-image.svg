<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Kafé Bangkok share image (1200 x 630), the source for og-image.png.
       The words use Bricolage Grotesque, Instrument Serif and Manrope;
       opened on its own, this file falls back to similar system fonts. -->
  <style>
    .cup-straw { fill: #DCEBFA; stroke: #1F2A44; stroke-width: 2.5; }
    .cup-milk { fill: #F3E4CF; }
    .cup-coffee { fill: #8A5A2B; }
    .cup-ice { fill: rgba(255,255,255,0.7); stroke: rgba(31,42,68,0.3); stroke-width: 1.5; }
    .cup-glass { fill: rgba(255,255,255,0.3); stroke: #1F2A44; stroke-width: 3; stroke-linejoin: round; }
    .cup-shine { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 6; stroke-linecap: round; }
    .cup-shine--soft { stroke: rgba(255,255,255,0.16); }
    .cup-badge { fill: #FFFFFF; stroke: #1F2A44; stroke-width: 2.5; }
    .cup-k { fill: none; stroke: #1F2A44; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
    .cup-lid { fill: #FBF7F0; stroke: #1F2A44; stroke-width: 3; stroke-linejoin: round; }
    .cup-lid--clear { fill: rgba(255,255,255,0.8); }
    .cup-paper { fill: #1F2A44; stroke: #1F2A44; stroke-width: 3; stroke-linejoin: round; }
    .cup-sleeve { fill: #E7CFAE; stroke: #1F2A44; stroke-width: 2.5; stroke-linejoin: round; }
    .cup-sip { fill: none; stroke: #1F2A44; stroke-width: 3.5; stroke-linecap: round; }
    .cup-steam { fill: none; stroke: #1F2A44; stroke-width: 3; stroke-linecap: round; opacity: 0.3; }
    .og-marquee { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 250px; letter-spacing: -10px; fill: rgba(255,255,255,0.32); }
    .og-pill { font-family: Manrope, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2.2px; fill: #1F2A44; }
    .og-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 92px; letter-spacing: -4px; fill: #1F2A44; }
    .og-accent { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 104px; fill: #8A5A2B; }
    .og-sub { font-family: Manrope, sans-serif; font-weight: 600; font-size: 28px; fill: #4A5470; }
  </style>
  <defs>
    <linearGradient id="og-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9E2F5"/>
      <stop offset="0.45" stop-color="#E3F0FA"/>
      <stop offset="0.85" stop-color="#F6EEE2"/>
      <stop offset="1" stop-color="#FBF7F0"/>
    </linearGradient>
    <radialGradient id="og-cloud">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-shadow">
      <stop offset="0" stop-color="#1F2A44" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#1F2A44" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-sky)"/>
  <ellipse cx="170" cy="70" rx="300" ry="90" fill="url(#og-cloud)"/>
  <ellipse cx="1040" cy="150" rx="320" ry="100" fill="url(#og-cloud)" opacity="0.85"/>
  <ellipse cx="620" cy="520" rx="300" ry="80" fill="url(#og-cloud)" opacity="0.7"/>
  <text class="og-marquee" x="-30" y="430">Bangkok · 7:00 coffee ·</text>

  <rect x="72" y="58" width="318" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
  <text class="og-pill" x="94" y="83">KAFÉ BANGKOK · CAFÉ FINDER</text>

  <text class="og-title" x="68" y="232">Find your</text>
  <text class="og-title" x="68" y="330">Bangkok café,</text>
  <text x="70" y="430"><tspan class="og-accent">today</tspan><tspan class="og-title">.</tspan></text>
  <text class="og-sub" x="72" y="500">Pick a mood. Get cafés ranked for you.</text>

  <ellipse cx="860" cy="512" rx="96" ry="12" fill="url(#og-shadow)"/>
  <ellipse cx="1040" cy="548" rx="100" ry="12" fill="url(#og-shadow)"/>
  <g transform="rotate(-6 860 300)">
    <svg x="760" y="140" width="200" height="300" viewBox="0 0 160 240">
              <defs>
                <clipPath id="iced-cup-inside">
                  <path d="M21 60 L35.5 222 Q36.5 229 44 229 L116 229 Q123.5 229 124.5 222 L139 60 Z"/>
                </clipPath>
              </defs>
              <!-- the straw first, so the clear cup sits over its lower part -->
              <rect class="cup-straw" x="92" y="2" width="10" height="132" rx="5" transform="rotate(10 97 68)"/>
              <!-- the drink: milk on top, coffee below, a few ice cubes -->
              <g clip-path="url(#iced-cup-inside)">
                <rect class="cup-milk" x="0" y="92" width="160" height="150"/>
                <path class="cup-coffee" d="M0 138 C30 126 52 150 82 138 C108 128 128 142 160 132 V240 H0 Z"/>
                <rect class="cup-ice" x="38" y="78" width="26" height="26" rx="6" transform="rotate(-14 51 91)"/>
                <rect class="cup-ice" x="72" y="72" width="28" height="28" rx="6" transform="rotate(9 86 86)"/>
                <rect class="cup-ice" x="104" y="84" width="22" height="22" rx="5" transform="rotate(-6 115 95)"/>
              </g>
              <!-- the clear plastic cup, a shine, our K mark and the lid -->
              <path class="cup-glass" d="M21 60 L35.5 222 Q36.5 229 44 229 L116 229 Q123.5 229 124.5 222 L139 60 Z"/>
              <path class="cup-shine" d="M34 78 L45 206"/>
              <circle class="cup-badge" cx="80" cy="172" r="22"/>
              <path class="cup-k" d="M73 160 V184 M73 173 L86.5 160 M76.5 170 L87.5 184"/>
              <rect class="cup-lid cup-lid--clear" x="14" y="50" width="132" height="12" rx="6"/>
            </svg>
  </g>
  <g transform="rotate(5 1040 340)">
    <svg x="935" y="190" width="210" height="315" viewBox="0 0 160 240">
              <path class="cup-steam" d="M68 32 C60 22 76 16 68 4"/>
              <path class="cup-steam cup-steam--2" d="M92 34 C84 24 100 18 92 6"/>
              <path class="cup-paper" d="M28 70 L42 226 Q43 233 50 233 L110 233 Q117 233 118 226 L132 70 Z"/>
              <path class="cup-shine cup-shine--soft" d="M44 86 L53 212"/>
              <!-- the cardboard sleeve, with our K mark -->
              <path class="cup-sleeve" d="M32.3 118 H127.7 L122 182 H38 Z"/>
              <circle class="cup-badge" cx="80" cy="150" r="21"/>
              <path class="cup-k" d="M73 138.5 V161.5 M73 151 L86 138.5 M76.5 148 L87 161.5"/>
              <!-- the lid: a dome on a rim, with a sip hole -->
              <path class="cup-lid" d="M34 58 C36 45 48 40 80 40 C112 40 124 45 126 58 Z"/>
              <rect class="cup-lid" x="22" y="56" width="116" height="15" rx="7.5"/>
              <path class="cup-sip" d="M96 49 H110"/>
            </svg>
  </g>
</svg>
