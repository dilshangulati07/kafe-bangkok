<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Kafé Bangkok favicon: the navy hot cup with its cream lid and white "K",
       on a sky-blue tile so it shows up on light and dark browser tabs. -->
  <rect width="32" height="32" rx="8" fill="#C9E2F5"/>
  <!-- cup -->
  <path d="M8.6 12.5h14.8l-1.9 14.3a1.7 1.7 0 0 1-1.7 1.4h-7.6a1.7 1.7 0 0 1-1.7-1.4z" fill="#1F2A44"/>
  <!-- lid: dome and rim -->
  <path d="M9.6 9.8c.5-2.7 2.6-3.6 6.4-3.6s5.9.9 6.4 3.6z" fill="#FBF7F0" stroke="#1F2A44" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="7.4" y="9.6" width="17.2" height="3.2" rx="1.6" fill="#FBF7F0" stroke="#1F2A44" stroke-width="1.5"/>
  <!-- our K mark -->
  <path d="M13.9 16.4v7.6M13.9 20.4l4.2-4M15.2 19.3l3 4.7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
